<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OG City — Prototype 0.2</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,Arial;color:#fff;overscroll-behavior:none}
#game{display:block;width:100vw;height:100dvh;background:#47764d;touch-action:none}
.hud{position:fixed;inset:calc(env(safe-area-inset-top) + 12px) 12px auto;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.panel{background:#101820d9;border:1px solid #ffffff24;border-radius:12px;padding:9px 12px;box-shadow:0 4px 18px #0005}
#help{font-size:12px;color:#d5e4dc;line-height:1.45}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 82px);transform:translateX(-50%);background:#101820e8;border:1px solid #ffffff30;border-radius:10px;padding:8px 12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.mobile-controls{position:fixed;inset:auto 22px calc(env(safe-area-inset-bottom) + 24px);display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:142px;height:142px;border-radius:50%;background:#10182099;border:2px solid #ffffff70;box-shadow:0 5px 22px #0005;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:62px;height:62px;left:38px;top:38px;border-radius:50%;background:#dce8e8d9;border:2px solid #ffffffc9;box-shadow:0 3px 10px #0006;pointer-events:none}
#action{width:88px;height:88px;border-radius:50%;border:2px solid #ffffff70;background:#101820d9;color:#fff;font-size:13px;font-weight:800;letter-spacing:.4px;box-shadow:0 5px 22px #0005;pointer-events:auto;touch-action:manipulation}
#action:active{background:#386d54}
@media(min-width:800px){.mobile-controls{display:none}}
@media(max-width:390px){#stick{width:124px;height:124px}#knob{width:56px;height:56px;left:32px;top:32px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="panel"><strong>OG CITY</strong><div style="font-size:11px;color:#a9cbb3">PROTOTIPO 0.2 · JOYSTICK</div></div>
 <div class="panel" id="help">Mover: joystick<br>Acción: botón · PC: WASD / flechas</div>
</div>
<div id="toast"></div>
<div class="mobile-controls">
 <div id="stick" aria-label="Joystick virtual"><div id="knob"></div></div>
 <button id="action" type="button">ACCIÓN</button>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const world={w:2200,h:1600};
const roads=[{x:0,y:280,w:2200,h:150},{x:0,y:800,w:2200,h:150},{x:370,y:0,w:150,h:1600},{x:1080,y:0,w:150,h:1600},{x:1770,y:0,w:150,h:1600}];
const buildings=[];
for(let x=45;x<2150;x+=230)for(let y of [55,485,975,1190]){
 if(roads.some(r=>x<r.x+r.w&&x+160>r.x&&y<r.y+r.h&&y+135>r.y))continue;
 buildings.push({x,y,w:150,h:125,c:['#b66b50','#71869a','#c49a5c','#8c779e'][Math.floor((x+y)%4)]});
}
const player={x:690,y:620,r:13,speed:220};
const cars=[{x:700,y:350,c:'#e6c84c'},{x:1390,y:870,c:'#d65c55'},{x:500,y:870,c:'#58a6a6'}];
const keys={};let stickVector={x:0,y:0},stickPointer=null;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
function setStick(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=r.width*.31,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 stickVector={x:dx/max,y:dy/max};
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetStick(){stickPointer=null;stickVector={x:0,y:0};knob.style.transform='translate(0px,0px)'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();setStick(e)}});
stick.addEventListener('pointerup',e=>{if(e.pointerId===stickPointer){e.preventDefault();resetStick()}});
stick.addEventListener('pointercancel',resetStick);
function collides(x,y){return buildings.some(b=>x+player.r>b.x&&x-player.r<b.x+b.w&&y+player.r>b.y&&y-player.r<b.y+b.h)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,1800)}
function action(){const near=cars.some(c=>Math.hypot(c.x-player.x,c.y-player.y)<58);toast(near?'Vehículo detectado. ¡Conducción próximamente!':'Acercate a un vehículo para interactuar.')}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='e')action()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('action').addEventListener('pointerdown',e=>{e.preventDefault();action()});
['contextmenu','selectstart','dragstart'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{capture:true}));
function draw(){
 const camX=Math.max(0,Math.min(world.w-W,player.x-W/2)),camY=Math.max(0,Math.min(world.h-H,player.y-H/2));
 ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-camX,-camY);
 ctx.fillStyle='#47764d';ctx.fillRect(0,0,world.w,world.h);
 for(let x=0;x<world.w;x+=230)for(let y=0;y<world.h;y+=220){ctx.fillStyle='#4d8054';ctx.fillRect(x+8,y+8,205,195)}
 roads.forEach(r=>{ctx.fillStyle='#343c43';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#d9c77b';ctx.lineWidth=3;ctx.setLineDash([24,22]);ctx.beginPath();if(r.w>r.h){ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2)}else{ctx.moveTo(r.x+r.w/2,r.y);ctx.lineTo(r.x+r.w/2,r.y+r.h)}ctx.stroke();ctx.setLineDash([])});
 buildings.forEach(b=>{ctx.fillStyle='#26352d';ctx.fillRect(b.x+7,b.y+9,b.w,b.h);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#e9d6aa';for(let wx=14;wx<b.w-12;wx+=38)for(let wy=16;wy<b.h-12;wy+=36)ctx.fillRect(b.x+wx,b.y+wy,17,15);ctx.fillStyle='#303b43';ctx.fillRect(b.x+b.w/2-17,b.y+b.h-30,34,30)});
 for(let x=30;x<world.w;x+=230)for(let y=30;y<world.h;y+=220){if(!roads.some(r=>x>r.x-20&&x<r.x+r.w+20&&y>r.y-20&&y<r.y+r.h+20)){ctx.fillStyle='#31543a';ctx.beginPath();ctx.arc(x+175,y+165,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6e9b59';ctx.beginPath();ctx.arc(x+175,y+159,13,0,Math.PI*2);ctx.fill()}}
 cars.forEach(c=>{ctx.fillStyle='#17252c';ctx.fillRect(c.x-25,c.y-13,50,26);ctx.fillStyle=c.c;ctx.fillRect(c.x-22,c.y-11,44,22);ctx.fillStyle='#b9d2d5';ctx.fillRect(c.x-8,c.y-9,16,18);ctx.fillStyle='#f8e9a8';ctx.fillRect(c.x+18,c.y-8,4,5)});
 ctx.fillStyle='#17232a';ctx.beginPath();ctx.ellipse(player.x,player.y+10,12,6,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f0c6a0';ctx.beginPath();ctx.arc(player.x,player.y-5,7,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#3ba6d8';ctx.fillRect(player.x-8,player.y+1,16,15);
 ctx.fillStyle='#182a35';ctx.fillRect(player.x-7,player.y+14,5,7);ctx.fillRect(player.x+2,player.y+14,5,7);
 ctx.restore();
}
let last=performance.now();
function loop(now){let dt=Math.min((now-last)/1000,.04);last=now;let dx=stickVector.x,dy=stickVector.y;
 if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
 if(dx||dy){const n=Math.hypot(dx,dy);dx=dx/n*player.speed*dt;dy=dy/n*player.speed*dt;let nx=player.x+dx,ny=player.y+dy;if(!collides(nx,player.y))player.x=nx;if(!collides(player.x,ny))player.y=ny;player.x=Math.max(15,Math.min(world.w-15,player.x));player.y=Math.max(15,Math.min(world.h-15,player.y))}
 draw();requestAnimationFrame(loop)}
toast('¡OG City 0.2 lista! Probá el joystick.');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
