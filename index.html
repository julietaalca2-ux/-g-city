<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OG City — Versión 0.4</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,Arial;color:#fff;overscroll-behavior:none}
#game{display:block;width:100vw;height:100dvh;background:#47764d;touch-action:none}
.hud{position:fixed;inset:calc(env(safe-area-inset-top) + 12px) 12px auto;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.panel{background:#101820d9;border:1px solid #ffffff24;border-radius:12px;padding:9px 12px;box-shadow:0 4px 18px #0005}
#help{font-size:12px;color:#d5e4dc;line-height:1.45}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 82px);transform:translateX(-50%);background:#101820e8;border:1px solid #ffffff30;border-radius:10px;padding:8px 12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.mobile-controls{position:fixed;inset:auto 22px calc(env(safe-area-inset-bottom) + 24px);display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:142px;height:142px;border-radius:50%;background:#10182099;border:2px solid #ffffff70;box-shadow:0 5px 22px #0005;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:62px;height:62px;left:38px;top:38px;border-radius:50%;background:#dce8e8d9;border:2px solid #ffffffc9;box-shadow:0 3px 10px #0006;pointer-events:none}
#action{width:88px;height:88px;border-radius:50%;border:2px solid #ffffff70;background:#101820d9;color:#fff;font-size:13px;font-weight:800;letter-spacing:.4px;box-shadow:0 5px 22px #0005;pointer-events:auto;touch-action:manipulation}
#action:active{background:#386d54}
@media(min-width:800px){.mobile-controls{display:none}}
@media(max-width:390px){#stick{width:124px;height:124px}#knob{width:56px;height:56px;left:32px;top:32px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="panel"><strong>OG CITY</strong><div style="font-size:11px;color:#a9cbb3">VERSIÓN 0.4 · CIUDAD ILUSTRADA</div></div>
 <div class="panel" id="help">Mover: joystick<br>Acción: subir/bajar del auto</div>
</div>
<div id="toast"></div>
<div class="mobile-controls">
 <div id="stick" aria-label="Joystick virtual"><div id="knob"></div></div>
 <button id="action" type="button">ACCIÓN</button>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const world={w:2200,h:1600};
const roads=[{x:0,y:280,w:2200,h:150},{x:0,y:800,w:2200,h:150},{x:370,y:0,w:150,h:1600},{x:1080,y:0,w:150,h:1600},{x:1770,y:0,w:150,h:1600}];
const buildings=[];
for(let x=45;x<2150;x+=230)for(let y of [55,485,975,1190]){
 if(roads.some(r=>x<r.x+r.w&&x+160>r.x&&y<r.y+r.h&&y+135>r.y))continue;
 buildings.push({x,y,w:150,h:125,c:['#b66b50','#71869a','#c49a5c','#8c779e'][Math.floor((x+y)%4)]});
}
const player={x:690,y:620,r:13,speed:220};
const cars=[
 {x:700,y:350,c:'#e6c84c',parked:true},
 {x:1390,y:870,c:'#d65c55',parked:true},
 {x:500,y:870,c:'#58a6a6',parked:true},
 {x:800,y:350,c:'#5d8bd1',parked:false,axis:'x',dir:1,speed:85},
 {x:1510,y:870,c:'#d98b4c',parked:false,axis:'x',dir:-1,speed:68},
 {x:1155,y:570,c:'#a5a5a5',parked:false,axis:'y',dir:1,speed:60}
];
const pedestrians=Array.from({length:16},(_,i)=>({
 x:120+(i*137)%1950,y:180+(i*193)%1300,
 dir:(i%4)*Math.PI/2,step:0.6+(i%5)*0.25,
 color:['#e6b45e','#d98b8b','#8cc3b1','#c4b3e0'][i%4]
}));
let inCar=-1;
const keys={};let stickVector={x:0,y:0},stickPointer=null;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
function setStick(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=r.width*.31,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 stickVector={x:dx/max,y:dy/max};
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetStick(){stickPointer=null;stickVector={x:0,y:0};knob.style.transform='translate(0px,0px)'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();setStick(e)}});
stick.addEventListener('pointerup',e=>{if(e.pointerId===stickPointer){e.preventDefault();resetStick()}});
stick.addEventListener('pointercancel',resetStick);
function collides(x,y){return buildings.some(b=>x+player.r>b.x&&x-player.r<b.x+b.w&&y+player.r>b.y&&y-player.r<b.y+b.h)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,1800)}
function action(){
 if(inCar>=0){inCar=-1;player.x=activeCar.x+38;player.y=activeCar.y+28;toast('Bajaste del vehículo.');return}
 let best=-1,dist=62;
 cars.forEach((c,i)=>{const d=Math.hypot(c.x-player.x,c.y-player.y);if(c.parked&&d<dist){best=i;dist=d}});
 if(best>=0){inCar=best;toast('¡Subiste al vehículo! Usá el joystick para conducir.')}
 else toast('Acercate a un auto estacionado para subir.');
}
let activeCar=null;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='e')action()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('action').addEventListener('pointerdown',e=>{e.preventDefault();action()});
['contextmenu','selectstart','dragstart'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{capture:true}));
function roundedRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(){
 const camX=Math.max(0,Math.min(world.w-W,player.x-W/2)),camY=Math.max(0,Math.min(world.h-H,player.y-H/2));
 ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-camX,-camY);
 // Suelo ilustrado con pequeñas variaciones de césped.
 ctx.fillStyle='#78ad68';ctx.fillRect(0,0,world.w,world.h);
 for(let x=0;x<world.w;x+=230)for(let y=0;y<world.h;y+=220){ctx.fillStyle='#83b874';ctx.fillRect(x+8,y+8,205,195);ctx.fillStyle='#91c27d';for(let k=0;k<7;k++){ctx.beginPath();ctx.arc(x+24+k*27,y+30+(k%3)*48,2,0,Math.PI*2);ctx.fill()}}
 // Veredas y calles.
 roads.forEach(r=>{ctx.fillStyle='#d7c9a4';ctx.fillRect(r.x-9,r.y-9,r.w+18,r.h+18);ctx.fillStyle='#4b5058';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#f2d77b';ctx.lineWidth=4;ctx.setLineDash([28,24]);ctx.beginPath();if(r.w>r.h){ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2)}else{ctx.moveTo(r.x+r.w/2,r.y);ctx.lineTo(r.x+r.w/2,r.y+r.h)}ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#626a70';ctx.lineWidth=2;ctx.strokeRect(r.x+3,r.y+3,r.w-6,r.h-6)});
 // Cruces peatonales decorativos en las intersecciones principales.
 [[370,280],[1080,280],[1770,280],[370,800],[1080,800],[1770,800]].forEach(([x,y])=>{ctx.fillStyle='#f4f0df';for(let i=0;i<5;i++){ctx.fillRect(x-58+i*24,y+12,13,48);ctx.fillRect(x+12,y-58+i*24,48,13)}});
 // Edificios tipo dibujo: sombra, paredes, techo, ventanas y entrada.
 buildings.forEach((b,i)=>{ctx.save();ctx.fillStyle='#42604455';ctx.beginPath();ctx.roundRect(b.x+8,b.y+12,b.w,b.h,12);ctx.fill();roundedRect(b.x,b.y,b.w,b.h,11,b.c,'#493f3a');roundedRect(b.x+8,b.y+8,b.w-16,b.h-16,7,null,'#ffffff55');ctx.fillStyle='#ffffff30';ctx.beginPath();ctx.roundRect(b.x+7,b.y+7,b.w-14,18,6);ctx.fill();
  for(let wx=15;wx<b.w-18;wx+=38)for(let wy=38;wy<b.h-38;wy+=37){roundedRect(b.x+wx,b.y+wy,18,17,3,'#d8eff0','#665b50');ctx.fillStyle='#ffffff99';ctx.fillRect(b.x+wx+3,b.y+wy+3,4,4)}
  roundedRect(b.x+b.w/2-17,b.y+b.h-31,34,31,5,'#765344','#493f3a');ctx.fillStyle='#f5d68c';ctx.fillRect(b.x+b.w/2+7,b.y+b.h-17,3,3);ctx.restore()});
 // Árboles ilustrados en los espacios verdes.
 for(let x=30;x<world.w;x+=230)for(let y=30;y<world.h;y+=220){let tx=x+175,ty=y+165;if(!roads.some(r=>tx>r.x-35&&tx<r.x+r.w+35&&ty>r.y-35&&ty<r.y+r.h+35)&&!buildings.some(b=>tx>b.x-22&&tx<b.x+b.w+22&&ty>b.y-22&&ty<b.y+b.h+22)){ctx.fillStyle='#476b43';ctx.beginPath();ctx.ellipse(tx+3,ty+10,17,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#79583c';ctx.fillRect(tx-4,ty-2,8,19);ctx.fillStyle='#397d4b';ctx.beginPath();ctx.arc(tx,ty-7,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#62a95a';ctx.beginPath();ctx.arc(tx-5,ty-12,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8bc96a';ctx.beginPath();ctx.arc(tx+5,ty-15,5,0,Math.PI*2);ctx.fill()}}
 // Vehículos con carrocería redondeada, cristales, luces y contorno.
 cars.forEach((c,i)=>{ctx.save();ctx.translate(c.x,c.y);if(c.axis==='y')ctx.rotate(Math.PI/2);ctx.fillStyle='#26323855';ctx.beginPath();ctx.ellipse(2,5,29,17,0,0,Math.PI*2);ctx.fill();roundedRect(-26,-15,52,30,9,'#263238','#263238');roundedRect(-23,-13,46,26,8,c.c,'#fff0d0');roundedRect(-9,-11,19,22,5,'#b8dfe4','#43545a');ctx.fillStyle='#fff2b0';roundedRect(19,-9,4,6,2,'#fff2b0');roundedRect(19,3,4,6,2,'#fff2b0');ctx.fillStyle='#252b31';ctx.fillRect(-17,-16,10,3);ctx.fillRect(7,-16,10,3);ctx.fillRect(-17,13,10,3);ctx.fillRect(7,13,10,3);if(i===inCar){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([5,3]);ctx.strokeRect(-29,-18,58,36)}ctx.restore()});
 // Peatones caricaturescos.
 pedestrians.forEach(p=>{ctx.fillStyle='#344a3c55';ctx.beginPath();ctx.ellipse(p.x,p.y+9,8,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#35465b';ctx.beginPath();ctx.roundRect(p.x-5,p.y-1,10,13,4);ctx.fill();ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y-5,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#624b40';ctx.lineWidth=1.5;ctx.stroke()});
 // Personaje principal con aspecto de dibujo.
 if(inCar<0){ctx.fillStyle='#26323866';ctx.beginPath();ctx.ellipse(player.x,player.y+12,13,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#26384b';ctx.beginPath();ctx.roundRect(player.x-9,player.y+2,18,20,5);ctx.fill();ctx.fillStyle='#3dafe0';ctx.beginPath();ctx.roundRect(player.x-9,player.y-1,18,17,5);ctx.fill();ctx.fillStyle='#f2c49b';ctx.beginPath();ctx.arc(player.x,player.y-7,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b392e';ctx.beginPath();ctx.arc(player.x,player.y-10,8,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#263238';ctx.fillRect(player.x-3,player.y-7,2,2);ctx.fillRect(player.x+3,player.y-7,2,2)}
 ctx.restore();
}
let last=performance.now();
function loop(now){let dt=Math.min((now-last)/1000,.04);last=now;let dx=stickVector.x,dy=stickVector.y;
 if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
 if(dx||dy){const n=Math.hypot(dx,dy);dx=dx/n;dy=dy/n;
  if(inCar>=0){
   activeCar=cars[inCar];const step=activeCar.speed*3.1*dt;
   let nx=activeCar.x+dx*step,ny=activeCar.y+dy*step;
   if(!collides(nx,ny)){activeCar.x=Math.max(25,Math.min(world.w-25,nx));activeCar.y=Math.max(25,Math.min(world.h-25,ny))}
   player.x=activeCar.x;player.y=activeCar.y;
  }else{
   const sx=dx*player.speed*dt,sy=dy*player.speed*dt;
   let nx=player.x+sx,ny=player.y+sy;
   if(!collides(nx,player.y))player.x=nx;if(!collides(player.x,ny))player.y=ny;
  }
  player.x=Math.max(15,Math.min(world.w-15,player.x));player.y=Math.max(15,Math.min(world.h-15,player.y));
 }
 // Tráfico sencillo: los autos no estacionados recorren sus calles.
 cars.forEach((c,i)=>{if(c.parked||i===inCar)return;if(c.axis==='x'){c.x+=c.dir*c.speed*dt;if(c.x<560||c.x>1680)c.dir*=-1}else{c.y+=c.dir*c.speed*dt;if(c.y<470||c.y>760)c.dir*=-1}});
 // Peatones pasean en pequeños recorridos y evitan edificios.
 pedestrians.forEach(p=>{p.step-=dt;if(p.step<=0){p.dir+=(Math.random()-.5)*1.8;p.step=0.7+Math.random()*1.8}
  const nx=p.x+Math.cos(p.dir)*27*dt,ny=p.y+Math.sin(p.dir)*27*dt;
  if(!collides(nx,ny)){p.x=nx;p.y=ny}else{p.dir+=Math.PI/2;p.step=.3}
  if(p.x<20||p.x>world.w-20||p.y<20||p.y>world.h-20)p.dir+=Math.PI;
 });
 draw();requestAnimationFrame(loop)}
toast('¡OG City 0.4: ciudad ilustrada! Acercate a un auto y tocá ACCIÓN.');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
